# Credenciais lidas do OCI Vault via Workload Identity. Somente nomes e OCIDs ficam no Git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-secrets
  namespace: observability
spec:
  provider: oci
  parameters:
    authType: workload
    vaultId: __OCI_VAULT_ID__
    secrets: |
      - name: __OCI_GRAFANA_ADMIN_USER_SECRET_NAME__
        stage: CURRENT
        fileName: GF_ADMIN_USER
      - name: __OCI_GRAFANA_ADMIN_PASSWORD_SECRET_NAME__
        stage: CURRENT
        fileName: GF_ADMIN_PASSWORD
      - name: __OCI_PAGERDUTY_INTEGRATION_KEY_SECRET_NAME__
        stage: CURRENT
        fileName: PAGERDUTY_INTEGRATION_KEY
      - name: __OCI_DISCORD_WEBHOOK_URL_SECRET_NAME__
        stage: CURRENT
        fileName: DISCORD_WEBHOOK_URL
      - name: __OCI_SELF_HEALING_TOKEN_SECRET_NAME__
        stage: CURRENT
        fileName: SELF_HEALING_TOKEN
  secretObjects:
    - secretName: grafana-secrets
      type: Opaque
      data:
        - key: GF_ADMIN_USER
          objectName: GF_ADMIN_USER
        - key: GF_ADMIN_PASSWORD
          objectName: GF_ADMIN_PASSWORD
        - key: PAGERDUTY_INTEGRATION_KEY
          objectName: PAGERDUTY_INTEGRATION_KEY
        - key: DISCORD_WEBHOOK_URL
          objectName: DISCORD_WEBHOOK_URL
        - key: SELF_HEALING_TOKEN
          objectName: SELF_HEALING_TOKEN
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: otel-collector-secrets
  namespace: observability
spec:
  provider: oci
  parameters:
    authType: workload
    vaultId: __OCI_VAULT_ID__
    secrets: |
      - name: __OCI_NEW_RELIC_LICENSE_KEY_SECRET_NAME__
        stage: CURRENT
        fileName: NEW_RELIC_LICENSE_KEY
  secretObjects:
    - secretName: otel-collector-secrets
      type: Opaque
      data:
        - key: NEW_RELIC_LICENSE_KEY
          objectName: NEW_RELIC_LICENSE_KEY
