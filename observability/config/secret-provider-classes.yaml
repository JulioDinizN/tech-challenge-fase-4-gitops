# Credenciais lidas do OCI Vault via Workload Identity. Somente nomes e OCIDs ficam no Git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-secrets
  namespace: observability
spec:
  provider: oci
  parameters:
    authType: workload
    vaultId: ocid1.vault.oc1.iad.ejvpmsrxaah6e.abuwcljrsq4jrksys3cs2xt5xa4ao3u5nxja2h5icd2dz7yq3daqdh4is7wq
    secrets: |
      - name: togglemaster-grafana-admin-user
        stage: CURRENT
        fileName: GF_ADMIN_USER
      - name: togglemaster-grafana-admin-password
        stage: CURRENT
        fileName: GF_ADMIN_PASSWORD
      - name: togglemaster-pagerduty-integration-key
        stage: CURRENT
        fileName: PAGERDUTY_INTEGRATION_KEY
      - name: togglemaster-discord-webhook-url
        stage: CURRENT
        fileName: DISCORD_WEBHOOK_URL
      - name: togglemaster-self-healing-token
        stage: CURRENT
        fileName: SELF_HEALING_TOKEN
  secretObjects:
    - secretName: grafana-secrets
      type: Opaque
      data:
        - key: GF_ADMIN_USER
          objectName: GF_ADMIN_USER
        - key: GF_ADMIN_PASSWORD
          objectName: GF_ADMIN_PASSWORD
        - key: PAGERDUTY_INTEGRATION_KEY
          objectName: PAGERDUTY_INTEGRATION_KEY
        - key: DISCORD_WEBHOOK_URL
          objectName: DISCORD_WEBHOOK_URL
        - key: SELF_HEALING_TOKEN
          objectName: SELF_HEALING_TOKEN
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: otel-collector-secrets
  namespace: observability
spec:
  provider: oci
  parameters:
    authType: workload
    vaultId: ocid1.vault.oc1.iad.ejvpmsrxaah6e.abuwcljrsq4jrksys3cs2xt5xa4ao3u5nxja2h5icd2dz7yq3daqdh4is7wq
    secrets: |
      - name: togglemaster-datadog-api-key
        stage: CURRENT
        fileName: DD_API_KEY
  secretObjects:
    - secretName: otel-collector-secrets
      type: Opaque
      data:
        - key: DD_API_KEY
          objectName: DD_API_KEY
