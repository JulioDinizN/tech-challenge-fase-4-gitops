apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - namespace.yaml
  - secret-provider-classes.yaml

generatorOptions:
  disableNameSuffixHash: true

# Dashboard e alertas carregados pelos sidecars do Grafana a partir dos rótulos abaixo.
configMapGenerator:
  - name: grafana-dashboard-togglemaster
    files:
      - grafana/dashboards/togglemaster-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: ToggleMaster
  - name: grafana-alerting-togglemaster
    files:
      - grafana/alerting/togglemaster-rules.yaml
      - grafana/alerting/contact-points.yaml
    options:
      labels:
        grafana_alert: "1"
